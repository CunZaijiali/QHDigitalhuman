[project]
name = "qhdigitalhuman"
version = "0.1.0"
description = "轻量数字人资产管理与渲染推流服务：把真人视频预处理成动作资产，再离线渲染或实时推流（RTMP / HLS / 虚拟摄像头）"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "CunZai", email = "cunzai1069@gmail.com" }
]
requires-python = ">=3.10"
keywords = [
    "digital-human",
    "lip-sync",
    "musetalk",
    "wav2lip",
    "rtmp",
    "virtual-camera",
    "tts",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    # ---- 推理 ----
    "torch>=2.7",
    "torchvision",
    "numpy",
    "diffusers>=0.40.0",
    "transformers>=5.17.0",
    # ---- 图像 / 视频 ----
    "opencv-python>=5.0.0.93",
    "pillow",
    # ---- 预处理的人脸检测链 ----
    "mediapipe==1.0.1",
    "mmpose>=1.3.2",
    "face-alignment>=1.5.0",
    # ---- 输出 ----
    "pyvirtualcam>=0.15",
    # ---- 其它 ----
    "requests>=2.28",
    # 读取 .env 里的密钥（TTS API key）；密钥绝不写进 config.toml
    "python-dotenv>=1.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "tqdm>=4.66.5",
]

[project.optional-dependencies]
# RTMP 推流用。需要把第三方扩展放到 vendor/python_rtmpstream/ 才能启用，
# 本仓库不包含它（上游许可未能核验，见 README「推流扩展」与 LICENSE）。
rtmp = ["rtmp-streaming"]

[project.scripts]
# 等价于 `python -m src.scripts.digitalhuman`
qhdigitalhuman = "qhdigitalhuman:main"

[project.urls]
Homepage = "https://github.com/CunZaijiali/QHDigitalhuman"
Repository = "https://github.com/CunZaijiali/QHDigitalhuman"
Issues = "https://github.com/CunZaijiali/QHDigitalhuman/issues"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu118"

[tool.uv.sources]
# 本地路径依赖，安装时从源码构建。注意：vendor/ 不在本仓库里（见 .gitignore），
# 只有把上游扩展放进去之后 `uv sync --extra rtmp` 才能解析到它。
# 构建需要 FFmpeg 8 的开发文件：用 FFMPEG_ROOT 环境变量指向安装目录。
rtmp-streaming = { path = "vendor/python_rtmpstream/python" }

[tool.uv]
# mmpose 依赖 chumpy 0.70，而它的 setup.py 在构建时 import pip，
# 隔离构建环境里没有 pip 就会失败（`No module named 'pip'`）。
# 给 chumpy 的构建环境额外装上 pip 和 setuptools。
extra-build-dependencies = { chumpy = ["pip", "setuptools"] }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
